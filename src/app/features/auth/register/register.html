<app-auth-layout
  title="Crear una cuenta"
  subtitle="Regístrate para acceder a las solicitudes de crédito."
>
  @if (created()) {
  <p class="notice notice-success" role="status">
    Tu cuenta se creó correctamente. Inicia sesión para continuar.
  </p>
  <a class="btn w-full" routerLink="/login">Ir al inicio de sesión</a>
  } @else { @if (error()) {
  <p class="notice notice-error" role="alert">{{ error() }}</p>
  }
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="grid gap-5"
    [attr.aria-busy]="busy()"
  >
    <label class="field"
      >Usuario
      <input
        class="input"
        formControlName="username"
        autocomplete="username"
        maxlength="50"
        aria-describedby="register-user-hint"
        [attr.aria-invalid]="form.controls.username.touched && form.controls.username.invalid"
      />
      <span
        id="register-user-hint"
        class="hint"
        [class.field-error]="form.controls.username.touched && form.controls.username.invalid"
        >3–50 caracteres: letras ASCII, números, punto, guion o guion
        bajo.</span
      >
    </label>
    <label class="field"
      >Correo electrónico
      <input
        class="input"
        type="email"
        formControlName="email"
        autocomplete="email"
        maxlength="250"
        aria-describedby="register-email-error"
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
      <span id="register-email-error" class="field-error"
        >Ingresa un correo válido de hasta 250 caracteres.</span
      >
      }
    </label>
    <label class="field"
      >Contraseña
      <input
        class="input"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        maxlength="120"
        aria-describedby="register-password-hint"
        [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
      />
      <span
        id="register-password-hint"
        class="hint"
        [class.field-error]="form.controls.password.touched && form.controls.password.invalid"
        >Entre 12 y 120 caracteres. Puedes usar una frase larga.</span
      >
    </label>
    <button class="btn w-full" type="submit" [disabled]="busy()">
      {{ busy() ? 'Creando cuenta…' : 'Crear cuenta' }}
    </button>
  </form>
  <p class="mt-7 text-sm text-gray-400">
    ¿Ya tienes cuenta?
    <a class="font-semibold" routerLink="/login">Inicia sesión</a>
  </p>
  }
</app-auth-layout>
