<dialog
  #dialog
  (cancel)="cancel($event)"
  class="m-auto max-h-[90dvh] w-[calc(100%-2rem)] max-w-lg overflow-y-auto rounded-xl border border-slate-200 bg-white p-6 text-slate-800 shadow-xl backdrop:bg-slate-950/50 sm:p-8"
  aria-labelledby="decision-title"
>
  <div class="mb-6 space-y-3">
    <h2 id="decision-title">
      {{ decision() === 'Approved' ? 'Aprobar' : 'Rechazar' }} solicitud #{{
      credit().id }}
    </h2>
    <p class="text-sm text-slate-500">
      {{ credit().applicantId }} · {{ credit().amount | currency:'USD' }}
    </p>
  </div>
  @if (error()) {
  <p class="notice notice-error mb-5" role="alert">{{ error() }}</p>
  }
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="grid gap-6"
    [attr.aria-busy]="busy()"
  >
    <label class="field"
      >Comentario de la decisión
      <textarea
        class="input resize-y"
        formControlName="comment"
        maxlength="2000"
        rows="4"
        autofocus
        aria-describedby="decision-hint"
        [attr.aria-invalid]="form.controls.comment.touched && form.controls.comment.invalid"
      ></textarea>
      <span
        id="decision-hint"
        class="hint"
        [class.field-error]="form.controls.comment.touched && form.controls.comment.invalid"
        >El comentario es obligatorio (máximo 2000 caracteres).</span
      >
    </label>
    <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
      <button
        class="btn btn-secondary"
        type="button"
        [disabled]="busy()"
        (click)="cancel()"
      >
        Cancelar
      </button>
      <button class="btn" type="submit" [disabled]="busy()">
        {{ busy() ? 'Guardando…' : 'Confirmar decisión' }}
      </button>
    </div>
  </form>
</dialog>
